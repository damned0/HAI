name: ksztalt oi_z (F+S)

on:
  workflow_dispatch:
    inputs:
      od: {description: "data od", default: "2023-01-01"}
      czesci: {description: "ile rownoleglych paczek", default: "20"}
      glebokosc: {description: "limit N x rozstep 14 h (2.0 = EPV/DEV, 1.5 = 2x wiecej wypelnien)", default: "2.0"}
      z_oi: {description: "1 = z danymi OI (tylko ocalale), 0 = bez OI (pozwala wziac WYCOFANE)", default: "1"}
      bramka: {description: "FS / F / BAZA — ktora bramka przepuszcza kandydatow", default: "FS"}
      jedno_zlecenie: {description: "1 = jedno zlecenie na monete (jak silnik), 0 = jak oryginalny pomiar, 6x wiecej transakcji", default: "1"}

jobs:
  przygotuj:
    runs-on: ubuntu-latest
    outputs: {paczki: "${{ steps.p.outputs.paczki }}"}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python - <<'PY' > m.json
          import json
          s=[x for x in open("monety.txt").read().strip().split(",") if x]
          n=${{ inputs.czesci }}
          print(json.dumps([{"nr":i,"monety":",".join(s[i::n])} for i in range(n) if s[i::n]]))
          PY
          echo "paczki=$(cat m.json)" >> $GITHUB_OUTPUT

  licz:
    needs: przygotuj
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy: {fail-fast: false, max-parallel: 20, matrix: {paczka: "${{ fromJson(needs.przygotuj.outputs.paczki) }}"}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet pandas pyarrow requests
      - run: python tools/oi_shard.py --monety "${{ matrix.paczka.monety }}" --od "${{ inputs.od }}" --glebokosc "${{ inputs.glebokosc }}" --jedno-zlecenie "${{ inputs.jedno_zlecenie }}" --bramka "${{ inputs.bramka }}" --z-oi "${{ inputs.z_oi }}" --wyjscie wynik
      - uses: actions/upload-artifact@v4
        with: {name: "paczka-${{ matrix.paczka.nr }}", path: wynik/, retention-days: 7}

  zbierz:
    needs: licz
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet pandas pyarrow
      - uses: actions/download-artifact@v4
        with: {path: paczki, pattern: "paczka-*"}
      - run: python tools/oi_agg.py | tee wynik.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WYNIK
          path: |
            wynik.txt
            wynik_tx.parquet
          retention-days: 30
